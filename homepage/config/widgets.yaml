# Top bar
- greeting:
    text_size: xl
    text: prezzers homelab

- resources:
    label: docker VM
    cpu: true
    memory: true
    disk: /
    expanded: true

- datetime:
    text_size: md
    format:
      dateStyle: medium
      timeStyle: short
      hour12: false

- search:
    provider: duckduckgo
    target: _blank

